r: 32
lora_alpha: 64
lora_dropout: 0.1
bias: "none"
# task_type: SEQ_2_SEQ_LM
# Targets attention projections AND feed-forward MLP layers in both
# encoder and decoder. fc1/fc2 give the model real capacity to adapt
# acoustic features (singing differs from speech here most strongly).
target_modules: ["q_proj", "k_proj", "v_proj", "out_proj", "fc1", "fc2"]
